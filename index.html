<title>Remote Jobs Harvest · Trin Millenia</title>
<style>
  :root{
    --butter:      #F6E7A0;
    --butter-soft: #FBF3CE;
    --butter-fg:   #6b5a12;
    --blue:        #257ec4;
    --ink:         #1f2430;
    --muted:       #6b7280;
    --line:        #e7e2cf;
    --card-line:   #ececec;
    --warn:        #b06a1f;
    --white:       #ffffff;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; background:var(--white); color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.5;
  }
  .serif{ font-family: Georgia, "Times New Roman", Times, serif; }

  /* Header */
  header{ padding: 60px 20px 36px; text-align:center; }
  .header-inner{ max-width: 620px; margin:0 auto; }
  .pill{
    display:inline-block; background:var(--butter-soft); color:var(--butter-fg);
    font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
    padding:5px 14px; border-radius:999px; margin-bottom:16px;
  }
  h1{ margin:0; font-size:44px; line-height:1.1; letter-spacing:-.5px; font-weight:700; }
  h1 .accent{ color:var(--blue); }
  .tagline{ margin:16px auto 0; max-width:440px; font-size:18px; color:var(--muted); }
  .cta{
    display:inline-block; margin-top:30px; background:var(--blue); color:#fff;
    text-decoration:none; font-weight:700; font-size:15px;
    padding:15px 30px; border-radius:16px; box-shadow:0 10px 22px rgba(37,126,196,.22);
    transition:transform .1s, background .15s;
  }
  .cta:hover{ background:#2071b0; }
  .cta:active{ transform:scale(.97); }

  /* Search */
  .search-wrap{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,.85);
    backdrop-filter:blur(8px); padding:14px 16px; }
  .search-inner{ max-width:600px; margin:0 auto; position:relative; }
  .search-inner svg{ position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--muted); }
  #search{
    width:100%; padding:15px 16px 15px 46px; font-size:15px; font-family:inherit;
    border:2px solid var(--card-line); border-radius:16px; background:#fff; color:var(--ink);
  }
  #search:focus{ outline:none; border-color:var(--blue); }

  /* Board */
  main{ max-width:600px; margin:0 auto; padding:24px 16px 80px; }
  .day{ margin-top:34px; }
  .day-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .day-label{ font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
  .day-line{ height:1px; flex:1; background:var(--line); }

  .job{
    position:relative; display:block; text-decoration:none; color:inherit;
    border:2px solid var(--card-line); border-radius:24px; padding:20px;
    margin-bottom:16px; background:#fff; transition:transform .1s, box-shadow .15s;
  }
  .job:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.06); }
  .job.feature{ background:var(--butter-soft); border-color:#ecdf98; }
  .fbadge{
    position:absolute; top:-12px; right:14px; display:flex; align-items:center; gap:4px;
    background:var(--butter); color:var(--butter-fg); font-size:10px; font-weight:800;
    letter-spacing:.3px; text-transform:uppercase; padding:5px 11px; border-radius:999px;
    box-shadow:0 2px 6px rgba(0,0,0,.08);
  }
  .row{ display:flex; gap:16px; }
  .emoji{
    width:48px; height:48px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:24px; background:#d6e9fb; border:1px solid #a9d0f2; border-radius:14px;
  }
  .body{ min-width:0; flex:1; }
  .job h3{ margin:0; font-size:19px; font-weight:700; line-height:1.25; }
  .meta{ margin-top:6px; font-size:14px; color:var(--muted); display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .meta .co{ font-weight:700; color:var(--ink); }
  .meta .dot{ color:#cfc9b4; }
  .warn{ margin-top:8px; display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--warn); }
  .note{ margin-top:8px; font-size:14px; font-style:italic; color:var(--muted); }
  .tags{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
  .tag{ background:#f3f4f6; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.3px;
    text-transform:uppercase; padding:4px 9px; border-radius:7px; }
  .empty{ text-align:center; color:var(--muted); padding:40px 0; }

  footer{ border-top:1px solid var(--line); padding:26px 20px; text-align:center; color:var(--muted); font-size:13px; }

  @media (max-width:640px){ h1{ font-size:34px; } .cta{ display:block; } }
</style>

const STORE_URL = "https://stan.store/thetrinmillenia";

function emojiFor(tags){
  const t = (tags||[]).join(" ").toLowerCase();
  if(t.includes("health")||t.includes("care")) return "🩺";
  if(t.includes("finance")||t.includes("payroll")) return "💰";
  if(t.includes("data")||t.includes("analyt")||t.includes("claims")) return "📊";
  if(t.includes("legal")) return "⚖️";
  if(t.includes("sales")) return "📈";
  if(t.includes("startup")||t.includes("tech")||t.includes("engineer")) return "💻";
  if(t.includes("customer")||t.includes("success")||t.includes("support")||t.includes("scheduling")) return "🎧";
  return "💼";
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDay(iso){
  const d = new Date(iso+"T00:00:00"); const today=new Date();
  const same=(a,b)=>a.toDateString()===b.toDateString();
  const y=new Date(today); y.setDate(today.getDate()-1);
  const s=d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  if(same(d,today)) return "Today, "+s;
  if(same(d,y)) return "Yesterday, "+s;
  return d.toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
}

function render(){
  const q=(document.getElementById("search").value||"").toLowerCase().trim();
  const board=document.getElementById("board");
  let jobs=JOBS.filter(j=>{
    if(!q) return true;
    return (j.title+" "+j.company+" "+j.level+" "+j.remote+" "+(j.tags||[]).join(" ")+" "+(j.note||"")).toLowerCase().includes(q);
  });
  jobs.sort((a,b)=>(b.dateAdded||"").localeCompare(a.dateAdded||""));
  if(jobs.length===0){ board.innerHTML='<p class="empty">No jobs match your search.</p>'; return; }

  const groups={}; jobs.forEach(j=>{(groups[j.dateAdded]=groups[j.dateAdded]||[]).push(j);});
  let out="";
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(day=>{
    // enforce one featured per day at display time
    let usedFeature=false;
    out+='<section class="day"><div class="day-head"><span class="day-label">'+fmtDay(day)+'</span><span class="day-line"></span></div>';
    groups[day].forEach(j=>{
      const feat = j.feature && !usedFeature; if(feat) usedFeature=true;
      out+=card(j,feat);
    });
    out+='</section>';
  });
  board.innerHTML=out;
}

function card(j,feat){
  let tags=(j.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("");
  return '<a class="job'+(feat?' feature':'')+'" href="'+esc(j.url)+'" target="_blank" rel="noopener noreferrer">'+
    (feat?'<span class="fbadge">★ Featured</span>':'')+
    '<div class="row"><div class="emoji">'+emojiFor(j.tags)+'</div><div class="body">'+
      '<h3 class="serif">'+esc(j.title)+'</h3>'+
      '<div class="meta"><span class="co">'+esc(j.company)+'</span>'+
        '<span class="dot">•</span><span>'+esc(j.salary||"Not listed")+'</span>'+
        '<span class="dot">•</span><span>'+esc(j.level||"—")+'</span>'+
        '<span class="dot">•</span><span>'+esc(j.remote||"Remote")+'</span></div>'+
      (j.phoneFlag?'<div class="warn">⚠ Direct phone interview required</div>':'')+
      (j.note?'<p class="note">'+esc(j.note)+'</p>':'')+
      '<div class="tags">'+tags+'</div>'+
    '</div></div></a>';
}

document.querySelector(".cta").setAttribute("href", STORE_URL);
